# U-Net baseline — CPU training config
# Start here, then move to GPU for full 100-epoch training

experiment_name: unet_baseline
seed: 42

data:
  image_dir: data/processed/images
  mask_dir: data/processed/masks
  train_split: data/splits/train.txt
  val_split: data/splits/val.txt
  test_split: data/splits/test.txt
  image_size: [512, 512]  # Proper size for paper results

model:
  name: unet
  encoder: resnet34  # Standard baseline encoder (~13M params)
  pretrained: true
  in_channels: 1
  num_classes: 1

training:
  epochs: 50
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: adamw
  scheduler: cosine
  early_stopping_patience: 15
  num_workers: 0

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  boundary_weight: 0.0
  from_logits: true

output:
  save_dir: experiments/unet
  save_best_only: true
