# v3 Iter 4: Fine-calibrated self-training round
# Key adjustments from iter3:
# - FDI 16/18 restored to stronger boost (degraded when reduced)
# - FDI 34/35/44 newly boosted (degraded without attention)
# - FDI 47/46 left to recover naturally (responding well)
# - Higher conf threshold for cleaner pseudo labels

experiment_name: ours_multiclass_v3_iter4
seed: 42

data:
  image_dir: data/processed/images
  mask_dir: data/processed/masks_multiclass
  pseudo_mask_dir: data/pseudo_masks_iter4
  train_split: data/splits/train.txt
  val_split: data/splits/val.txt
  test_split: data/splits/test.txt
  image_size: [512, 512]
  num_classes: 53
  pseudo_quality_threshold: 0.25
  phase1_epochs: 50
  phase2_epochs: 60

model:
  name: unet
  encoder: mobilenet_v2
  pretrained: true
  in_channels: 1
  num_classes: 53

training:
  batch_size: 8
  learning_rate: 0.0002
  phase2_lr: 0.00003
  weight_decay: 0.00001
  optimizer: adamw
  scheduler: cosine
  early_stopping_patience: 30
  num_workers: 4
  gradient_accumulation_steps: 1
  hard_class_boost:
    # 53-class iter4: focused on remaining dead/weak deciduous
    # Dead deciduous (Q6/Q7/Q8 mostly)
    61: 8.0   # FDI 61 (0.004)
    62: 8.0   # FDI 62 (0.076)
    63: 8.0   # FDI 63 (0.061)
    64: 8.0   # FDI 64 (0.000)
    65: 8.0   # FDI 65 (0.000)
    72: 8.0   # FDI 72 (0.000)
    73: 8.0   # FDI 73 (0.000)
    74: 8.0   # FDI 74 (0.000)
    75: 8.0   # FDI 75 (0.003)
    81: 8.0   # FDI 81 (0.000)
    82: 8.0   # FDI 82 (0.115)
    83: 6.0   # FDI 83 (0.166)
    # Weak deciduous (keep moderate boost)
    51: 4.0   # FDI 51 (0.376)
    52: 4.0   # FDI 52 (0.375)
    53: 3.0   # FDI 53 (0.461)
    71: 4.0   # FDI 71 (0.334)
    84: 4.0   # FDI 84 (0.349)
    # Weak permanent
    45: 3.0   # FDI 45 (0.346)
    42: 2.0   # FDI 42 (0.423)

deep_supervision:
  enabled: true
  aux_scales: [1, 2, 3]
  aux_weight: 0.35

loss:
  ce_weight: 1.0
  dice_weight: 1.0
  boundary_weight: 0.5
  boundary_radius: 2
  boundary_emphasis: 5.0
  use_class_weights: true
  label_smoothing: 0.05

output:
  save_dir: experiments/ours_multiclass_v3_iter4
  save_best_only: true
