# v3 Iter 3: Third-round self-training with calibrated class boosts
# Changes from iter2:
# - Pseudo labels from iter2 model (Dice 0.636)
# - FDI 47 boost removed (over-boost degraded it: 0.310→0.176)
# - FDI 46 boost reduced (degraded under high boost)
# - Focused boosts on classes that responded well
# - Higher pseudo quality threshold
# - Longer training for convergence

experiment_name: ours_multiclass_v3_selective
seed: 42

data:
  image_dir: data/processed/images
  mask_dir: data/processed/masks_multiclass
  pseudo_mask_dir: data/pseudo_masks_selective
  train_split: data/splits/train.txt
  val_split: data/splits/val.txt
  test_split: data/splits/test.txt
  image_size: [512, 512]
  num_classes: 53
  pseudo_quality_threshold: 0.3
  phase1_epochs: 50
  phase2_epochs: 60

model:
  name: unet
  encoder: mobilenet_v2
  pretrained: true
  in_channels: 1
  num_classes: 53

training:
  batch_size: 8
  learning_rate: 0.0002
  phase2_lr: 0.00005
  weight_decay: 0.00001
  optimizer: adamw
  scheduler: cosine
  early_stopping_patience: 30
  num_workers: 4
  gradient_accumulation_steps: 1
  hard_class_boost:
    # 53-class iter3: keep perm boosts + focus on dead deciduous
    5: 2.5    # FDI 16
    6: 2.5    # FDI 17
    7: 3.0    # FDI 18
    12: 2.0   # FDI 25
    14: 2.0   # FDI 27
    28: 2.5   # FDI 45
    29: 1.5   # FDI 46
    # Deciduous -- live but weak
    51: 6.0   # FDI 51 (0.144)
    52: 6.0   # FDI 52 (0.151)
    53: 5.0   # FDI 53 (0.215)
    55: 4.0   # FDI 55 (0.436)
    # Deciduous -- dead, heavy boost
    54: 8.0   # FDI 54 (0.000)
    61: 8.0   # FDI 61 (0.020)
    62: 8.0   # FDI 62 (0.024)
    63: 8.0   # FDI 63 (0.000)
    64: 8.0   # FDI 64 (0.000)
    65: 8.0   # FDI 65 (0.000)
    71: 6.0   # FDI 71 (0.149)
    72: 6.0   # FDI 72 (0.153)
    73: 4.0   # FDI 73 (0.328)
    74: 6.0   # FDI 74 (0.135)
    75: 8.0   # FDI 75 (0.030)
    81: 8.0   # FDI 81 (0.003)
    82: 8.0   # FDI 82 (0.000)
    83: 6.0   # FDI 83 (0.066)
    84: 8.0   # FDI 84 (0.005)
    85: 6.0   # FDI 85 (0.161)

deep_supervision:
  enabled: true
  aux_scales: [1, 2, 3]
  aux_weight: 0.3

loss:
  ce_weight: 1.0
  dice_weight: 1.0
  boundary_weight: 0.5
  boundary_radius: 2
  boundary_emphasis: 5.0
  use_class_weights: true
  label_smoothing: 0.05

output:
  save_dir: experiments/ours_multiclass_v3_selective
  save_best_only: true
