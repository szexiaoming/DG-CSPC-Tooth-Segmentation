# v3-lite: Boundary Loss only (no Deep Supervision)
# Use this for quick comparison: v2 baseline vs v3 boundary-enhanced

experiment_name: ours_multiclass_v3_lite
seed: 42

data:
  image_dir: data/processed/images
  mask_dir: data/processed/masks_multiclass
  pseudo_mask_dir: data/pseudo_masks_multiclass
  train_split: data/splits/train.txt
  val_split: data/splits/val.txt
  test_split: data/splits/test.txt
  image_size: [512, 512]
  num_classes: 53
  pseudo_quality_threshold: 0.4
  phase1_epochs: 40
  phase2_epochs: 30

model:
  name: unet
  encoder: mobilenet_v2
  pretrained: true
  in_channels: 1
  num_classes: 53

training:
  batch_size: 8
  learning_rate: 0.0002
  phase2_lr: 0.00005
  weight_decay: 0.00001
  optimizer: adamw
  scheduler: cosine
  early_stopping_patience: 15
  num_workers: 4
  gradient_accumulation_steps: 1

# Deep supervision DISABLED for fair comparison with v2
deep_supervision:
  enabled: false

# Boundary-enhanced loss enabled
loss:
  ce_weight: 1.0
  dice_weight: 1.0
  boundary_weight: 0.5
  boundary_radius: 2
  boundary_emphasis: 5.0
  use_class_weights: true
  label_smoothing: 0.0

output:
  save_dir: experiments/ours_multiclass_v3_lite
  save_best_only: true
