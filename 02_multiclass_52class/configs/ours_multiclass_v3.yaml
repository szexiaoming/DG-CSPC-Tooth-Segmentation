# v3: Boundary Loss + Deep Supervision + Hungarian matching
# Improvements over v2:
# - Boundary-enhanced loss for sharper tooth edges
# - Deep supervision for better gradient flow
# - Compatible with Hungarian-matched pseudo labels

experiment_name: ours_multiclass_v3
seed: 42

data:
  image_dir: data/processed/images
  mask_dir: data/processed/masks_multiclass
  # Use v3 pseudo masks (Hungarian matching) or fall back to v1:
  pseudo_mask_dir: data/pseudo_masks_multiclass
  train_split: data/splits/train.txt
  val_split: data/splits/val.txt
  test_split: data/splits/test.txt
  image_size: [512, 512]
  num_classes: 53
  pseudo_quality_threshold: 0.4
  phase1_epochs: 40
  phase2_epochs: 35

model:
  name: unet
  encoder: mobilenet_v2
  pretrained: true
  in_channels: 1
  num_classes: 53

training:
  batch_size: 8
  learning_rate: 0.0002
  phase2_lr: 0.00005
  weight_decay: 0.00001
  optimizer: adamw
  scheduler: cosine
  early_stopping_patience: 20
  num_workers: 4
  gradient_accumulation_steps: 1
  # Boost loss weight for classes with poor pseudo-label quality
  hard_class_boost:
    4: 3.0    # FDI 14 (0.20 Dice)
    7: 3.0    # FDI 17 (0.17 Dice)
    # Deciduous teeth (33-52): only 5/21 train images contain them → heavy boost
    33: 5.0   # FDI 51
    34: 5.0   # FDI 52
    35: 5.0   # FDI 53
    36: 5.0   # FDI 54
    37: 5.0   # FDI 55
    38: 5.0   # FDI 61
    39: 5.0   # FDI 62
    40: 5.0   # FDI 63
    41: 5.0   # FDI 64
    42: 5.0   # FDI 65
    43: 5.0   # FDI 71
    44: 5.0   # FDI 72
    45: 5.0   # FDI 73
    46: 5.0   # FDI 74
    47: 5.0   # FDI 75
    48: 5.0   # FDI 81
    49: 5.0   # FDI 82
    50: 5.0   # FDI 83
    51: 5.0   # FDI 84
    52: 5.0   # FDI 85

# Deep supervision: add auxiliary segmentation heads at encoder levels
# Levels: 0=1/2, 1=1/4, 2=1/8, 3=1/16, 4=1/32 resolution
# Recommended [1,2,3] for MobileNetV2
deep_supervision:
  enabled: true
  aux_scales: [1, 2, 3]     # Supervise at 1/4, 1/8, 1/16 scale
  aux_weight: 0.3            # Auxiliary loss weight (relative to main loss)

# Boundary-enhanced multi-class loss
loss:
  ce_weight: 1.0
  dice_weight: 1.0
  boundary_weight: 0.5        # Extra emphasis on boundary pixels
  boundary_radius: 2          # Pixel band around boundaries
  boundary_emphasis: 5.0      # Weight multiplier for boundary pixels
  use_class_weights: true
  label_smoothing: 0.0

output:
  save_dir: experiments/ours_multiclass_v3
  save_best_only: true
