# v3 Iter 2: Self-training with model predictions + extended hard class boost
# Changes from v3:
# - Pseudo labels from model self-training (not YOLO+SAM)
# - Hard class boost extended to all weak classes (Dice < 0.5)
# - Longer phase 2 training for better pseudo label integration
# - TTA during pseudo label generation

experiment_name: ours_multiclass_v3_iter2
seed: 42

data:
  image_dir: data/processed/images
  mask_dir: data/processed/masks_multiclass
  pseudo_mask_dir: data/pseudo_masks_yolo_sam
  train_split: data/splits/train.txt
  val_split: data/splits/val.txt
  test_split: data/splits/test.txt
  image_size: [512, 512]
  num_classes: 53
  pseudo_quality_threshold: 0.3
  phase1_epochs: 40
  phase2_epochs: 50

model:
  name: unet
  encoder: mobilenet_v2
  pretrained: true
  in_channels: 1
  num_classes: 53

training:
  batch_size: 8
  learning_rate: 0.0002
  phase2_lr: 0.00005
  weight_decay: 0.00001
  optimizer: adamw
  scheduler: cosine
  early_stopping_patience: 25
  num_workers: 4
  gradient_accumulation_steps: 1
  hard_class_boost:
    # Weak perm classes from iter1
    5: 3.0    # FDI 16
    6: 3.0    # FDI 17
    7: 4.0    # FDI 18
    12: 2.5   # FDI 25
    14: 2.5   # FDI 27
    30: 4.0   # FDI 47
    4: 3.0    # FDI 15
    11: 2.0   # FDI 24
    29: 2.0   # FDI 46
    # Deciduous boosts (all 52 classes)
    33: 5.0   # FDI 51
    34: 5.0   # FDI 52
    35: 5.0   # FDI 53
    36: 5.0   # FDI 54
    37: 5.0   # FDI 55
    38: 5.0   # FDI 61
    39: 5.0   # FDI 62
    40: 5.0   # FDI 63
    41: 5.0   # FDI 64
    42: 5.0   # FDI 65
    43: 5.0   # FDI 71
    44: 5.0   # FDI 72
    45: 5.0   # FDI 73
    46: 5.0   # FDI 74
    47: 5.0   # FDI 75
    48: 5.0   # FDI 81
    49: 5.0   # FDI 82
    50: 5.0   # FDI 83
    51: 5.0   # FDI 84
    52: 5.0   # FDI 85

deep_supervision:
  enabled: true
  aux_scales: [1, 2, 3]
  aux_weight: 0.3

loss:
  ce_weight: 1.0
  dice_weight: 1.0
  boundary_weight: 0.5
  boundary_radius: 2
  boundary_emphasis: 5.0
  use_class_weights: true
  label_smoothing: 0.05

output:
  save_dir: experiments/ours_multiclass_v3_iter2
  save_best_only: true
